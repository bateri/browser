[package]
name = "browser-helper"
description = "The hidden Chromium helper that draws a browser element for a terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "bateri-browser"
path = "src/main.rs"

[[bin]]
name = "bateri-browser-helper"
path = "src/bin/subprocess.rs"

[[bin]]
name = "bundle"
path = "src/bin/bundle.rs"

[dependencies]
cef = "156.7.0"
cef-dll-sys = "156.7.0"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSEvent", "NSGraphicsContext", "NSResponder", "NSWindow", "NSRunningApplication"] }
libc = "0.2"
serde_json = "1"
base64 = "0.22"
anyhow = "1"
semver = "1"
plist = "1"
browser-ipc = { path = "../ipc" }
