[package]
name = "browser-ipc"
description = "What bateri and the browser helper say to each other"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
mach2 = "0.4"
libc = "0.2"

[features]
# The receiving side's import of a frame into a wgpu texture (bateri's renderer).
wgpu = ["dep:wgpu", "dep:objc2", "dep:objc2-metal", "dep:objc2-io-surface"]

[dependencies.wgpu]
version = "30"
default-features = false
features = ["std", "wgsl", "metal"]
optional = true

[dependencies.objc2]
version = "0.6"
optional = true

[dependencies.objc2-metal]
version = "0.3"
features = ["objc2-io-surface"]
optional = true

[dependencies.objc2-io-surface]
version = "0.3"
optional = true
